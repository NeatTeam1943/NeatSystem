name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mock
      - name: mt-auth is the auth-js version MoneyTeam ships
        run: |
          lock=$(curl -fsSL https://raw.githubusercontent.com/NeatTeam1943/MoneyTeam/main/package-lock.json) || { echo "::warning::MoneyTeam's package-lock.json is not reachable"; exit 0; }
          theirs=$(echo "$lock" | jq -r '.packages["node_modules/@supabase/auth-js"].version')
          ours=$(jq -r '.dependencies["mt-auth"]' package.json | sed 's/.*@//')
          echo "MoneyTeam: $theirs  mt-auth: $ours"
          test "$theirs" = "$ours"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
