name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MONEYTEAM_URL: https://neatteam1943.github.io/MoneyTeam/
          # public values (MoneyTeam's site already ships them): repo Variables or Secrets
          VITE_MONEYTEAM_SUPABASE_URL: ${{ vars.MONEYTEAM_SUPABASE_URL || secrets.MONEYTEAM_SUPABASE_URL }}
          VITE_MONEYTEAM_SUPABASE_ANON_KEY: ${{ vars.MONEYTEAM_SUPABASE_ANON_KEY || secrets.MONEYTEAM_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
